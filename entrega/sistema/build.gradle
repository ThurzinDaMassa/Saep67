plugins {
    id 'application'
}

dependencies {
    implementation files('lib/mariadb-java-client-3.5.7.jar')
}

application { mainClass = 'br.saep.estoque.WebApp' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(11) }
}

tasks.register('runDesktop', JavaExec) {
    group = 'application'
    description = 'Abre a versão desktop do sistema SAEP.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.saep.estoque.App'
}

tasks.register('verifyLogic', JavaExec) {
    group = 'verification'
    description = 'Executa as verificações de regras de negócio.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.saep.estoque.LogicTest'
}

tasks.register('verifyWeb', JavaExec) {
    group = 'verification'
    description = 'Executa as verificações HTTP com o banco local.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.saep.estoque.WebIntegrationTest'
}

tasks.register('verifyProfile', JavaExec) {
    group = 'verification'
    description = 'Verifica edição de perfil, senha e imagens com o banco local.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.saep.estoque.ProfileIntegrationTest'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(11) }
}

tasks.register('standaloneJar', Jar) {
    group = 'distribution'
    description = 'Gera um JAR executável com o driver JDBC para o aplicativo web.'
    dependsOn classes
    archiveFileName = 'SAEP-Site.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'br.saep.estoque.WebLauncher' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
